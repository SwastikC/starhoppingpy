[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "starhoppingpy"
version = "0.1.0"
description = "Star-hopping RDI reduction pipeline for VLT/SPHERE-IRDIS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
]

[project.optional-dependencies]
# unlzw3: read compressed .fits.Z archive files
# scikit-image: image resizing in basic.py
# fpdf: basic.pdf_creator
# pysynphot: zfuncs.zp photometry (also needs PYSYN_CDBS reference files)
extras = ["unlzw3", "scikit-image", "fpdf"]
notebooks = ["jupyter", "ipywidgets"]

[tool.setuptools.packages.find]
where = ["src"]
